<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" fill="none">
  <defs>
    <!-- Royal Blue Linear Gradient matching image.png -->
    <linearGradient id="royalBlueGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="45%" stop-color="#0052CC" />
      <stop offset="100%" stop-color="#003D99" />
    </linearGradient>

    <!-- Subtle embossed depth filter -->
    <filter id="soft3DShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#002966" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#soft3DShadow)">
    <!-- Lightbulb Dome & Neck -->
    <path 
      d="M 86 150 C 83 138 71 122 62 104 C 50 80 56 46 86 30 C 104 20 136 20 154 30 C 184 46 190 80 178 104 C 169 122 157 138 154 150" 
      stroke="url(#royalBlueGrad)" 
      stroke-width="10.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Screw Base Threads (3 rounded horizontal bars) -->
    <path d="M 91 166 L 149 166" stroke="url(#royalBlueGrad)" stroke-width="10.5" stroke-linecap="round" />
    <path d="M 95 180 L 145 180" stroke="url(#royalBlueGrad)" stroke-width="10.5" stroke-linecap="round" />
    <path d="M 102 194 L 138 194" stroke="url(#royalBlueGrad)" stroke-width="10.5" stroke-linecap="round" />

    <!-- Brain Left Hemisphere -->
    <!-- Center fissure is at X = 114 (12px gap between X = 114 and X = 126, center at 120) -->
    <g id="brainHemisphere" stroke="url(#royalBlueGrad)" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Vertical midline border -->
      <path d="M 114 46 L 114 118" />

      <!-- Outer Top Lobe (Frontal lobe) -->
      <path d="M 114 46 C 100 45 84 52 78 64 C 73 74 74 82 80 87" />

      <!-- Upper Sulcus fold curving in toward midline -->
      <path d="M 80 87 C 88 91 97 89 104 84" />

      <!-- Middle-to-Bottom Outer Lobe (Temporal/Occipital lobes) -->
      <path d="M 80 87 C 72 93 71 104 77 114 C 84 125 99 126 109 122 C 113 120 114 116 114 112" />

      <!-- Lower Sulcus fold -->
      <path d="M 114 96 C 106 96 99 102 99 110" />
    </g>

    <!-- Brain Right Hemisphere (Mirror of left across X = 120) -->
    <use href="#brainHemisphere" transform="translate(240, 0) scale(-1, 1)" />

    <!-- "Jasne." Wordmark Typography -->
    <text 
      x="120" 
      y="254" 
      text-anchor="middle" 
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif" 
      font-weight="900" 
      font-size="52" 
      letter-spacing="-1.5px" 
      fill="url(#royalBlueGrad)"
    >Jasne<tspan fill="url(#royalBlueGrad)">.</tspan></text>
  </g>
</svg>