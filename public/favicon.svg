<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="favSunGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFE033" />
      <stop offset="45%" stop-color="#FFC700" />
      <stop offset="100%" stop-color="#EAA000" />
    </linearGradient>
    <filter id="favDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#B45309" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#favDrop)">
    <!-- Zewnętrzny kontur bańki żarówki -->
    <path 
      d="M 48 68 C 45 62 38 52 34 43 C 28 32 30 18 44 11 C 52 7 68 7 76 11 C 90 18 92 32 86 43 C 82 52 75 62 72 68 L 72 69 C 72 72 69 74 66 74 L 54 74 C 51 74 48 72 48 69 Z" 
      stroke="url(#favSunGrad)" 
      stroke-width="5.8" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Wewnętrzny łuk kopuły -->
    <path 
      d="M 46 33 C 48 23 56 18 60 18 C 64 18 72 23 74 33" 
      stroke="url(#favSunGrad)" 
      stroke-width="5" 
      stroke-linecap="round" 
    />

    <!-- Żarnik w centrum -->
    <path 
      d="M 56 70 L 56 59 C 56 56 53 52 50 49 C 47 46 47 41 51 39 C 54 37 57 38 60 43 C 63 38 66 37 69 39 C 73 41 73 46 70 49 C 67 52 64 56 64 59 L 64 70" 
      stroke="url(#favSunGrad)" 
      stroke-width="5" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- Gwint żarówki (3 zaokrąglone paski) -->
    <path d="M 49 80 L 71 78" stroke="url(#favSunGrad)" stroke-width="5.2" stroke-linecap="round" />
    <path d="M 51 87 L 69 85" stroke="url(#favSunGrad)" stroke-width="5.2" stroke-linecap="round" />
    <path d="M 54 94 C 57 96 63 96 66 94" stroke="url(#favSunGrad)" stroke-width="4.8" stroke-linecap="round" />
  </g>
</svg>
