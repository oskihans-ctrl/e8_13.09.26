<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="jasneBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2979FF" />
      <stop offset="40%" stop-color="#0052CC" />
      <stop offset="100%" stop-color="#003D99" />
    </linearGradient>
    
  </defs>

  <g >
    <!-- Bulb Contour -->
    <path 
      d="M 37 66 C 35 60 29 52 25 44 C 20 34 24 19 36 12 C 44 8 56 8 64 12 C 76 19 80 34 75 44 C 71 52 65 60 63 66" 
      stroke="url(#jasneBlueGrad)" 
      stroke-width="4.8" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Screw Base Threads -->
    <path d="M 38 73 L 62 73" stroke="url(#jasneBlueGrad)" stroke-width="4.8" stroke-linecap="round" />
    <path d="M 40 79 L 60 79" stroke="url(#jasneBlueGrad)" stroke-width="4.8" stroke-linecap="round" />
    <path d="M 43 85 L 57 85" stroke="url(#jasneBlueGrad)" stroke-width="4.8" stroke-linecap="round" />

    <!-- Left Hemisphere Brain -->
    <g id="brainHemisphere" stroke="url(#jasneBlueGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Vertical Midline Fissure -->
      <path d="M 47.5 20 L 47.5 49" />
      <!-- Top Lobe -->
      <path d="M 47.5 20 C 42 19 36 22 33 27 C 30 31 31 35 34 38" />
      <!-- Top Inward Convolution Fold -->
      <path d="M 34 38 C 37 40 41 39 44 36" />
      <!-- Middle Lobe -->
      <path d="M 34 38 C 30 41 30 46 33 50" />
      <!-- Middle Inward Convolution Fold -->
      <path d="M 33 50 C 37 52 41 50 44 47" />
      <!-- Bottom Lobe -->
      <path d="M 33 50 C 35 54 40 56 44 54 C 46.5 52.5 47.5 51 47.5 49" />
    </g>

    <!-- Right Hemisphere Brain (Mirrored) -->
    <use href="#brainHemisphere" transform="translate(100, 0) scale(-1, 1)" />
  </g>
</svg>